<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{SUBJECT}}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f5f5f4;
      color: #1c1917;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.65;
      -webkit-text-size-adjust: 100%;
    }
    table { border-collapse: collapse; mso-table-lspace: 0; mso-table-rspace: 0; }
    img   { border: 0; display: block; max-width: 100%; }

    .outer { width: 100%; background-color: #f5f5f4; padding: 40px 16px; }
    .card {
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 12px;
      border: 1px solid #e7e5e4;
      overflow: hidden;
    }

    /* ── header ── */
    .head     { padding: 30px 32px 0; }
    .kicker   { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #a8a29e; margin: 0 0 10px; }
    .title    { font-size: 23px; font-weight: 650; color: #1c1917; margin: 0 0 12px; line-height: 1.3; letter-spacing: -0.01em; }
    .headline { font-size: 16px; color: #44403c; margin: 0 0 14px; line-height: 1.5; }
    .meta     { font-size: 12px; color: #a8a29e; margin: 0; }
    .meta .sep { margin: 0 8px; color: #d6d3d1; }

    .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; vertical-align: middle; }
    .badge-critical { background-color: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .badge-warning  { background-color: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .badge-watching { background-color: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .badge-clean    { background-color: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .badge-info     { background-color: #f5f5f4; color: #57534e; border: 1px solid #e7e5e4; }

    /* ── metric strip ── */
    .metrics { margin: 22px 0 4px; border-top: 1px solid #f0efee; border-bottom: 1px solid #f0efee; }
    .metric  { padding: 16px 16px 16px 0; }
    .metric-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #a8a29e; margin: 0 0 5px; }
    .metric-value { font-size: 21px; font-weight: 650; color: #1c1917; margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
    .delta      { font-size: 12px; margin: 4px 0 0; color: #78716c; }
    .delta-up   { color: #15803d; }
    .delta-down { color: #b91c1c; }

    /* ── body ── */
    .body { padding: 4px 32px 8px; }

    h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #a8a29e; margin: 30px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #f0efee; }
    h3 { font-size: 15px; font-weight: 650; color: #1c1917; margin: 22px 0 6px; }
    p  { margin: 10px 0; color: #44403c; }
    a  { color: #0f766e; text-decoration: none; border-bottom: 1px solid rgba(15,118,110,0.28); }
    ul, ol { margin: 10px 0; padding-left: 20px; }
    li { color: #44403c; margin-bottom: 5px; }
    strong, b { color: #1c1917; font-weight: 650; }
    .rule { border: none; border-top: 1px solid #f0efee; margin: 26px 0; }

    code { font-family: 'SF Mono','Fira Code','Courier New',monospace; font-size: 13px; background-color: #f5f5f4; color: #6d28d9; padding: 1px 5px; border-radius: 4px; }
    pre  { font-family: 'SF Mono','Fira Code','Courier New',monospace; font-size: 12.5px; background-color: #fafaf9; color: #44403c; border: 1px solid #f0efee; border-left: 3px solid #d6d3d1; padding: 14px 16px; margin: 14px 0; white-space: pre-wrap; word-break: break-word; border-radius: 0 6px 6px 0; }

    blockquote { margin: 18px 0; padding: 12px 16px; border-left: 3px solid {{COLOR}}; background-color: #fafaf9; border-radius: 0 6px 6px 0; }
    blockquote p { margin: 0; color: #57534e; font-size: 14px; }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 14px 0; }
    table.data { width: 100%; min-width: 460px; font-size: 13.5px; border-collapse: collapse; }
    table.data th {
      padding: 9px 12px; text-align: left; font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase; color: #a8a29e;
      background-color: #fafaf9; border-bottom: 1px solid #e7e5e4; white-space: nowrap;
    }
    table.data td { padding: 10px 12px; color: #44403c; border-bottom: 1px solid #f5f5f4; }
    table.data tr:last-child td { border-bottom: none; }
    table.data td strong { color: #1c1917; }

    /* ── dashboard CTA ── */
    .cta { margin: 28px 0 4px; padding: 18px 20px; background-color: #fafaf9; border: 1px solid #f0efee; border-radius: 8px; }
    .cta-link { font-size: 14px; font-weight: 650; color: {{COLOR}}; text-decoration: none; border-bottom: none; }
    .cta-hint { font-size: 12px; color: #a8a29e; margin: 4px 0 0; }

    /* ── footer ── */
    .foot { padding: 20px 32px 26px; border-top: 1px solid #f0efee; margin-top: 26px; }
    .foot-left  { font-size: 11px; color: #c8c4c0; }
    .foot-right { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #d6d3d1; text-align: right; }

    @media only screen and (max-width: 640px) {
      .outer { padding: 16px 10px !important; }
      .head  { padding: 22px 20px 0 !important; }
      .body  { padding: 4px 20px 8px !important; }
      .foot  { padding: 18px 20px 22px !important; }
      .title { font-size: 20px !important; }
      .headline { font-size: 15px !important; }
      /* stack the metric strip — four columns at 320px is unreadable */
      .metric { display: block !important; width: 100% !important; padding: 12px 0 !important; border-bottom: 1px solid #f5f5f4; }
      .metric-value { font-size: 19px !important; }
      table.data th, table.data td { padding: 7px 9px !important; font-size: 12.5px !important; }
    }

    @media (prefers-color-scheme: dark) {
      body            { background-color: #0c0a09 !important; color: #d6d3d1 !important; }
      .outer          { background-color: #0c0a09 !important; }
      .card           { background-color: #161513 !important; border-color: #292524 !important; }
      .kicker         { color: #6b6560 !important; }
      .title          { color: #f5f5f4 !important; }
      .headline       { color: #b8b2ac !important; }
      .meta           { color: #6b6560 !important; }
      .meta .sep      { color: #3a3532 !important; }
      .metrics        { border-color: #262220 !important; }
      .metric-label   { color: #6b6560 !important; }
      .metric-value   { color: #f5f5f4 !important; }
      .delta          { color: #8a837d !important; }
      .delta-up       { color: #4ade80 !important; }
      .delta-down     { color: #f87171 !important; }
      .metric         { border-color: #262220 !important; }
      h2              { color: #6b6560 !important; border-bottom-color: #262220 !important; }
      h3              { color: #ececea !important; }
      p               { color: #b0aaa4 !important; }
      li              { color: #b0aaa4 !important; }
      strong, b       { color: #f0efee !important; }
      a               { color: #2dd4bf !important; border-bottom-color: rgba(45,212,191,0.3) !important; }
      .rule           { border-top-color: #262220 !important; }
      code            { background-color: #221f1d !important; color: #c4b5fd !important; }
      pre             { background-color: #1a1817 !important; border-color: #262220 !important; border-left-color: #3a3532 !important; color: #b0aaa4 !important; }
      blockquote      { background-color: #1a1817 !important; }
      blockquote p    { color: #8a837d !important; }
      table.data th   { color: #6b6560 !important; background-color: #1a1817 !important; border-bottom-color: #292524 !important; }
      table.data td   { color: #b0aaa4 !important; border-bottom-color: #221f1d !important; }
      table.data td strong { color: #f0efee !important; }
      .cta            { background-color: #1a1817 !important; border-color: #262220 !important; }
      .cta-hint       { color: #6b6560 !important; }
      .badge-critical { background-color: #3b0a0a !important; color: #f87171 !important; border-color: #7f1d1d !important; }
      .badge-warning  { background-color: #2d1a00 !important; color: #fbbf24 !important; border-color: #78350f !important; }
      .badge-watching { background-color: #0c1a2e !important; color: #60a5fa !important; border-color: #1e3a5f !important; }
      .badge-clean    { background-color: #052e16 !important; color: #4ade80 !important; border-color: #14532d !important; }
      .badge-info     { background-color: #221f1d !important; color: #a8a29e !important; border-color: #292524 !important; }
      .foot           { border-top-color: #262220 !important; }
      .foot-left      { color: #4a4542 !important; }
      .foot-right     { color: #3a3532 !important; }
    }
  </style>
</head>
<body>
<div class="outer">
  <div class="card" style="max-width:{{WIDTH}}">

    <div class="head">
      <p class="kicker">{{KICKER}}</p>
      <h1 class="title">{{SUBJECT}}</h1>
      {{HEADLINE}}
      <p class="meta">
        {{TIMESTAMP}}
        <span class="sep">|</span>
        <span class="{{PILL_CLASS}}">{{SEVERITY}}</span>
      </p>
      {{METRICS}}
    </div>

    <div class="body">
      {{BODY}}
      {{DASHBOARD_CTA}}
    </div>

    <div class="foot">
      <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
        <tr>
          <td class="foot-left">Automated report &middot; Do not reply</td>
          <td class="foot-right">Sentinel</td>
        </tr>
      </table>
    </div>

  </div>
</div>
</body>
</html>
